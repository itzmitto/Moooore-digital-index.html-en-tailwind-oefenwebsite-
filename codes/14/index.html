<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shuffle Pinned List</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        font-family: Arial, sans-serif;
      }
      .list-container {
        position: relative;
        width: 380px;
        height: 500px;
        overflow: hidden;
        border: 1px solid #e5e5e9;
        border-radius: 32px;
        background: #fefefe;
        padding: 16px;
      }
      .list-scroll {
        position: relative;
        width: 100%;
        height: 100%;
        overflow-y: auto;
        scroll-behavior: smooth;
        scrollbar-width: none;
      }
      .list-scroll::-webkit-scrollbar {
        display: none;
      }
      .pinned-section {
        margin-bottom: 8px;
      }
      .pinned-card {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 8px 12px;
        border-radius: 999px;
        background: #f6f5fa;
        cursor: pointer;
        transition: transform 0.2s ease;
      }
      .pinned-card:hover {
        transform: scale(1.01);
      }
      .pinned-left {
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
        flex: 1;
      }
      .icon-circle {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: white;
      }
      .pin-icon {
        color: #d9d9df;
        font-size: 21px;
      }
      .hero-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #29292d;
        font-size: 17px;
        font-weight: 700;
        transition:
          opacity 0.2s ease,
          transform 0.2s ease;
      }
      .shuffle-button {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        border: 0;
        border-radius: 50%;
        background: #fefefe;
        color: #9999a2;
        font-size: 22px;
        cursor: pointer;
        transition:
          transform 0.15s ease,
          background 0.2s ease;
      }
      .shuffle-button:hover {
        background: #f1f1f4;
      }
      .shuffle-button:active {
        transform: scale(0.94);
      }
      .today {
        margin: 8px 8px 6px;
        color: #adacb4;
        font-size: 16px;
        font-weight: 600;
      }
      .items {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .item {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 60px;
        padding: 8px;
        border-radius: 999px;
        overflow: hidden;
        transition:
          background 0.2s ease,
          transform 0.2s ease;
      }
      .item:hover {
        background: #f6f5fa;
      }
      .item.highlighted {
        animation: highlight 0.7s ease;
      }
      @keyframes highlight {
        0% {
          transform: scale(1);
        }
        35% {
          transform: scale(1.03);
        }
        100% {
          transform: scale(1);
        }
      }
      .item-left {
        position: relative;
        z-index: 2;
        display: flex;
        align-items: center;
        gap: 16px;
        min-width: 0;
        flex: 1;
      }
      .item-icon {
        width: 44px;
        height: 44px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #e5e5e9;
        border-radius: 50%;
        background: #fefefe;
        color: #d5d4e0;
        font-size: 19px;
      }
      .item-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: #262626;
        font-size: 15px;
        font-weight: 700;
      }
      .item-pin {
        position: relative;
        z-index: 3;
        width: 40px;
        height: 40px;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 0;
        border-radius: 50%;
        background: transparent;
        color: #adacb8;
        font-size: 20px;
        cursor: pointer;
        opacity: 0;
        transition:
          opacity 0.2s ease,
          color 0.2s ease,
          background 0.2s ease;
      }
      .item:hover .item-pin,
      .item-pin.pinned {
        opacity: 1;
      }
      .item-pin:hover {
        background: rgba(0, 0, 0, 0.04);
        color: #6a6970;
      }
      .fade {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        height: 80px;
        pointer-events: none;
        border-radius: 0 0 32px 32px;
        background: linear-gradient(
          to top,
          #fefefe 0%,
          rgba(254, 254, 254, 0.9) 25%,
          rgba(254, 254, 254, 0) 100%
        );
        opacity: 1;
        transition: opacity 0.2s ease;
      }
      .fade.hidden {
        opacity: 0;
      }
      @media (max-width: 450px) {
        .list-container {
          width: calc(100vw - 30px);
        }
      }
    </style>
  </head>
  <body>
    <div class="list-container">
      <div class="list-scroll" id="listScroll">
        <div class="pinned-section" id="pinnedSection"></div>
        <div class="today">Today</div>
        <div class="items" id="items"></div>
      </div>
      <div class="fade" id="fade"></div>
    </div>

    <script>
      const defaultItems = [
        { id: "1", text: "Daily Fitness Tracker", isPinned: false },
        { id: "2", text: "Voice Command Tips", isPinned: false },
        { id: "3", text: "iOS Shortcuts Guide", isPinned: false },
        { id: "4", text: "Focus Mode Ideas", isPinned: false },
        { id: "5", text: "50 Productivity Hacks", isPinned: false },
        { id: "6", text: "Lunch Recipe Ideas", isPinned: false },
        { id: "7", text: "Snack Ideas For Kids", isPinned: false },
      ];

      let items = [...defaultItems];
      let activePinnedIndex = 0;

      const itemsContainer = document.getElementById("items");
      const pinnedSection = document.getElementById("pinnedSection");
      const listScroll = document.getElementById("listScroll");
      const fade = document.getElementById("fade");

      function getPinnedItems() {
        return items.filter((item) => item.isPinned);
      }

      function renderPinned() {
        const pinnedItems = getPinnedItems();

        if (pinnedItems.length === 0) {
          pinnedSection.innerHTML = "";
          return;
        }

        if (activePinnedIndex >= pinnedItems.length) {
          activePinnedIndex = Math.max(pinnedItems.length - 1, 0);
        }

        const currentItem = pinnedItems[activePinnedIndex];

        pinnedSection.innerHTML = `
                <div class="pinned-card" onclick="shufflePinned()">
                    <div class="pinned-left">
                        <div class="icon-circle">
                            <span class="pin-icon">📌</span>
                        </div>
                        <span class="hero-text" id="heroText">${currentItem.text}</span>
                    </div>
                    ${
                      pinnedItems.length > 1
                        ? `<button class="shuffle-button" onclick="event.stopPropagation(); shufflePinned()">↕</button>`
                        : ""
                    }
                </div>
            `;

        const heroText = document.getElementById("heroText");

        heroText.style.opacity = "0";
        heroText.style.transform = "scale(0.8)";

        requestAnimationFrame(() => {
          heroText.style.opacity = "1";
          heroText.style.transform = "scale(1)";
        });
      }

      function renderItems() {
        itemsContainer.innerHTML = "";

        items.forEach((item) => {
          const isHighlighted =
            getPinnedItems()[activePinnedIndex]?.id === item.id;

          const element = document.createElement("div");

          element.className = `item ${isHighlighted ? "highlighted" : ""}`;

          element.innerHTML = `
                    ${isHighlighted ? '<div style="position:absolute;inset:0;background:#f6f5fa;border-radius:999px;opacity:0.5;"></div>' : ""}
                    <div class="item-left">
                        <div class="item-icon">💬</div>
                        <span class="item-text">${item.text}</span>
                    </div>
                    <button
                        class="item-pin ${item.isPinned ? "pinned" : ""}"
                        title="Pin"
                        onclick="togglePin('${item.id}', event)"
                    >
                        📌
                    </button>
                `;

          itemsContainer.appendChild(element);
        });
      }

      function togglePin(id, event) {
        event.stopPropagation();

        const item = items.find((item) => item.id === id);

        if (!item) {
          return;
        }

        item.isPinned = !item.isPinned;

        const pinnedItems = getPinnedItems();

        if (item.isPinned) {
          activePinnedIndex = pinnedItems.findIndex(
            (pinnedItem) => pinnedItem.id === id,
          );
        } else {
          activePinnedIndex = Math.min(
            activePinnedIndex,
            Math.max(pinnedItems.length - 1, 0),
          );
        }

        renderPinned();
        renderItems();
      }

      function shufflePinned() {
        const pinnedItems = getPinnedItems();

        if (pinnedItems.length <= 1) {
          return;
        }

        activePinnedIndex = (activePinnedIndex + 1) % pinnedItems.length;

        renderPinned();
        renderItems();
      }

      function checkScroll() {
        const isAtBottom =
          listScroll.scrollTop + listScroll.clientHeight >=
          listScroll.scrollHeight - 1;

        fade.classList.toggle("hidden", isAtBottom);
      }

      listScroll.addEventListener("scroll", checkScroll);
      window.addEventListener("resize", checkScroll);

      renderPinned();
      renderItems();
      checkScroll();
    </script>
  </body>
</html>
