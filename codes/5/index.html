<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Card Carousel</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body class="bg-sky-200 min-h-screen flex items-center justify-center">
  <div class="w-[350px]">
    <div class="relative overflow-hidden rounded-2xl">
      <div id="carousel" class="flex transition-transform duration-500">
        <div class="w-full shrink-0 bg-white p-6">
          <img src="https://picsum.photos/id/1011/350/200" class="w-full h-48 object-cover rounded-xl">
          <h2 class="text-xl font-bold mt-4">Mountain</h2>
          <p class="text-gray-500 mt-2">Explore the mountains.</p>
        </div>
        <div class="w-full shrink-0 bg-white p-6">
          <img src="https://picsum.photos/id/1015/350/200" class="w-full h-48 object-cover rounded-xl">
          <h2 class="text-xl font-bold mt-4">Nature</h2>
          <p class="text-gray-500 mt-2">Beautiful nature everywhere.</p>
        </div>
        <div class="w-full shrink-0 bg-white p-6">
          <img src="https://picsum.photos/id/1016/350/200" class="w-full h-48 object-cover rounded-xl">
          <h2 class="text-xl font-bold mt-4">Forest</h2>
          <p class="text-gray-500 mt-2">Lost in the forest.</p>
        </div>
        <div class="w-full shrink-0 bg-white p-6">
          <img src="https://picsum.photos/id/1018/350/200" class="w-full h-48 object-cover rounded-xl">
          <h2 class="text-xl font-bold mt-4">Lake</h2>
          <p class="text-gray-500 mt-2">Peaceful lake view.</p>
        </div>
        <div class="w-full shrink-0 bg-white p-6">
          <img src="https://picsum.photos/id/1019/350/200" class="w-full h-48 object-cover rounded-xl">
          <h2 class="text-xl font-bold mt-4">Adventure</h2>
          <p class="text-gray-500 mt-2">Time for an adventure.</p>
        </div>
      </div>
      <button id="prev" class="absolute left-3 top-1/2 -translate-y-1/2 bg-black/60 text-white w-9 h-9 rounded-full">
        <i class="fa-solid fa-chevron-left"></i>
      </button>
      <button id="next" class="absolute right-3 top-1/2 -translate-y-1/2 bg-black/60 text-white w-9 h-9 rounded-full">
        <i class="fa-solid fa-chevron-right"></i>
      </button>
    </div>
    <div id="dots" class="flex justify-center gap-2 mt-4"></div>
  </div>
  
</body>
</html>
