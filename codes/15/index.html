<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adaptive Slider</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #09090b;
            font-family: Arial, sans-serif;
        }
        .slider-card {
            width: 380px;
            height: 500px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px;
            border-radius: 36px;
            background: #fefefe;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.08);
            user-select: none;
        }
        .label {
            margin-bottom: 8px;
            color: #878787;
            font-size: 24px;
            font-weight: 700;
        }
        .calorie-display {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 32px;
        }
        .calories {
            min-width: 150px;
            color: #10b981;
            font-size: 64px;
            line-height: 1;
            font-weight: 800;
            letter-spacing: -2px;
            text-align: right;
            transition: color 0.4s ease;
        }
        .unit {
            color: #010101;
            font-size: 48px;
            line-height: 1;
            font-weight: 800;
        }
        .slider {
            position: relative;
            width: 100%;
            height: 52px;
            overflow: hidden;
            border-radius: 999px;
            background: #f1f3f5;
        }
        .progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            min-width: 52px;
            border-radius: 999px;
            transition:
                width 0.25s ease,
                background 0.4s ease;
        }
        .dots {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 2;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 24px;
            pointer-events: none;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #c4b9fa;
            opacity: 0.8;
            transition: background 0.3s ease;
        }
        .range-input {
            position: absolute;
            inset: 0;
            z-index: 10;
            width: 100%;
            height: 100%;
            margin: 0;
            cursor: pointer;
            opacity: 0;
        }
        .thumb {
            position: absolute;
            top: 0;
            z-index: 5;
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            pointer-events: none;
            transition: left 0.25s ease;
        }
        .thumb-inner {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: white;
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.06);
        }
        @media (max-width: 450px) {
            .slider-card {
                width: calc(100vw - 30px);
                height: 500px;
                padding: 32px;
            }
            .calories {
                font-size: 54px;
            }
            .unit {
                font-size: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="slider-card">
        <div class="label">Calories</div>

        <div class="calorie-display">
            <div class="calories" id="calories">200</div>
            <div class="unit">kCal</div>
        </div>

        <div class="slider" id="slider">
            <div class="progress" id="progress"></div>

            <div class="dots">
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>

            <input
                id="rangeInput"
                class="range-input"
                type="range"
                min="50"
                max="350"
                step="25"
                value="200"
                title="Calories"
            >

            <div class="thumb" id="thumb">
                <div class="thumb-inner"></div>
            </div>
        </div>
    </div>

    <script>
        const rangeInput = document.getElementById("rangeInput");
        const caloriesElement = document.getElementById("calories");
        const progress = document.getElementById("progress");
        const thumb = document.getElementById("thumb");

        const min = 50;
        const max = 350;

        function updateSlider() {
            const value = Number(rangeInput.value);
            const percentage = (value - min) / (max - min);
            const percent = percentage * 100;

            caloriesElement.textContent = value;

            if (percentage < 0.5) {
                caloriesElement.style.color = "#10B981";

                progress.style.background =
                    "linear-gradient(to right, #FEB101, #FE7C09)";
            } else if (percentage < 0.7) {
                caloriesElement.style.color = "#FE55B7";

                progress.style.background =
                    "linear-gradient(to right, #FE55B74D, #FE55B7)";
            } else {
                caloriesElement.style.color = "#D946EF";

                progress.style.background =
                    "linear-gradient(to right, #DAB0FE, #4946FF)";
            }

            const sliderWidth = rangeInput.offsetWidth;
            const thumbWidth = 52;

            const thumbPosition =
                percentage * (sliderWidth - thumbWidth);

            thumb.style.left = `${thumbPosition}px`;

            const progressWidth =
                thumbPosition + thumbWidth;

            progress.style.width = `${progressWidth}px`;
        }

        rangeInput.addEventListener("input", updateSlider);
        window.addEventListener("resize", updateSlider);

        updateSlider();
    </script>

</body>
</html>
