<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple Slider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.0/css/all.min.css"
    />
  </head>
  <body
    class="min-h-screen flex items-center justify-center bg-gradient-to-br from-sky-100 via-blue-50 to-cyan-100 p-6"
  >
    <div class="w-full max-w-4xl">
      <div class="bg-white/70 backdrop-blur-md rounded-3xl shadow-xl p-6">
        <div class="relative overflow-hidden rounded-2xl">
          <div id="slider" class="flex transition-transform duration-500">
            <div class="min-w-full px-1">
              <img
                src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1200&q=80"
                class="w-full h-96 object-cover rounded-2xl"
              />
              <div class="text-center pt-5">
                <h2 class="text-2xl font-bold text-blue-600">Image 1</h2>
                <p class="mt-2 text-gray-600">
                  Dit is een random afbeelding van een mooi berglandschap.
                </p>
              </div>
            </div>
            <div class="min-w-full px-1">
              <img
                src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1200&q=80"
                class="w-full h-96 object-cover rounded-2xl"
              />
              <div class="text-center pt-5">
                <h2 class="text-2xl font-bold text-blue-600">Image 2</h2>
                <p class="mt-2 text-gray-600">
                  Dit is een random afbeelding van een prachtig natuurgebied.
                </p>
              </div>
            </div>
            <div class="min-w-full px-1">
              <img
                src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=80"
                class="w-full h-96 object-cover rounded-2xl"
              />
              <div class="text-center pt-5">
                <h2 class="text-2xl font-bold text-blue-600">Image 3</h2>
                <p class="mt-2 text-gray-600">
                  Dit is een random afbeelding van een rustig meer tussen de
                  bergen.
                </p>
              </div>
            </div>
            <div class="min-w-full px-1">
              <img
                src="https://images.unsplash.com/photo-1493246507139-91e8fad9978e?auto=format&fit=crop&w=1200&q=80"
                class="w-full h-96 object-cover rounded-2xl"
              />
              <div class="text-center pt-5">
                <h2 class="text-2xl font-bold text-blue-600">Image 4</h2>
                <p class="mt-2 text-gray-600">
                  Dit is een random afbeelding van een groen bos in de natuur.
                </p>
              </div>
            </div>
          </div>
          <button
            id="prev"
            class="absolute left-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-blue-500 w-12 h-12 rounded-full shadow flex items-center justify-center transition"
          >
            <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button
            id="next"
            class="absolute right-4 top-1/2 -translate-y-1/2 bg-white/80 hover:bg-white text-blue-500 w-12 h-12 rounded-full shadow flex items-center justify-center transition"
          >
            <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
        <div id="dots" class="flex justify-center gap-2 mt-5"></div>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
