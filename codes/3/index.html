<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slider</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
  </head>
  <body class="bg-gray-100 flex items-center justify-center min-h-screen">
    <div class="relative w-[500px]">
      <div class="overflow-hidden rounded-xl">
        <div id="slider" class="flex transition-transform duration-500">
          <img
            src="https://picsum.photos/id/1015/500/300"
            class="w-full shrink-0"
          />
          <img
            src="https://picsum.photos/id/1016/500/300"
            class="w-full shrink-0"
          />
          <img
            src="https://picsum.photos/id/1018/500/300"
            class="w-full shrink-0"
          />
        </div>
      </div>
      <button
        id="prev"
        class="absolute left-3 top-1/2 -translate-y-1/2 bg-white/80 w-10 h-10 rounded-full hover:bg-white"
      >
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <button
        id="next"
        class="absolute right-3 top-1/2 -translate-y-1/2 bg-white/80 w-10 h-10 rounded-full hover:bg-white"
      >
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </div>
    <script>
      const slider = document.getElementById("slider");
      const slides = slider.children.length;
      let currentSlide = 0;
      function showSlide() {
        slider.style.transform = `translateX(-${currentSlide * 100}%)`;
      }
      document.getElementById("next").addEventListener("click", () => {
        currentSlide++;
        if (currentSlide >= slides) {
          currentSlide = 0;
        }
        showSlide();
      });
      document.getElementById("prev").addEventListener("click", () => {
        currentSlide--;
        if (currentSlide < 0) {
          currentSlide = slides - 1;
        }
        showSlide();
      });
    </script>
  </body>
</html>
